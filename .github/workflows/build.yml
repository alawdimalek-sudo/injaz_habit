name: Build Injaz APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Skeleton
        run: |
          # توليد ملفات أندرويد الناقصة تلقائياً
          flutter create . --org com.injaz.tracker --project-name injaz_app

      - name: Configure Android Permissions & Desugaring
        run: |
          # 1. إضافة صلاحيات الإشعارات إلى AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>' $MANIFEST_PATH

          # 2. تفعيل desugaring في build.gradle لحزمة الإشعارات
          APP_GRADLE="android/app/build.gradle"
          sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' $APP_GRADLE
          sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' $APP_GRADLE

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Injaz-Habit-Tracker-APK
          path: build/app/outputs/flutter-apk/app-release.apk
