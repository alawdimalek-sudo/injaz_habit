name: Build Injaz APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Skeleton
        run: |
          # حفظ نسخة احتياطية من ملفاتك
          cp lib/main.dart /tmp/main.dart.bak || true
          cp pubspec.yaml /tmp/pubspec.yaml.bak || true

          # إنشاء بيئة أندرويد
          flutter create --platforms=android --org com.injaz.tracker .

          # استرجاع ملفاتك الأصلية لضمان عدم المساس بها
          cp /tmp/main.dart.bak lib/main.dart || true
          cp /tmp/pubspec.yaml.bak pubspec.yaml || true

      - name: Configure Android Permissions & Desugaring
        run: |
          python3 - << 'EOF'
          import os

          # 1. إضافة صلاحيات الإشعارات بدقة
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()
              permissions = """
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              """
              if "POST_NOTIFICATIONS" not in content:
                  content = content.replace("<application", permissions + "\n    <application", 1)
                  with open(manifest_path, "w", encoding="utf-8") as f:
                      f.write(content)

          # 2. تفعيل Desugaring للإشعارات المتوافقة مع أندرويد الحديث والقديم
          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"

          if os.path.exists(kts_path):
              with open(kts_path, "r", encoding="utf-8") as f:
                  text = f.read()
              if "isCoreLibraryDesugaringEnabled" not in text:
                  text = text.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
                  if "dependencies {" in text:
                      text = text.replace("dependencies {", 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")')
                  else:
                      text += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                  with open(kts_path, "w", encoding="utf-8") as f:
                      f.write(text)

          elif os.path.exists(groovy_path):
              with open(groovy_path, "r", encoding="utf-8") as f:
                  text = f.read()
              if "coreLibraryDesugaringEnabled" not in text:
                  text = text.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
                  if "dependencies {" in text:
                      text = text.replace("dependencies {", 'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"')
                  else:
                      text += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
                  with open(groovy_path, "w", encoding="utf-8") as f:
                      f.write(text)
          EOF

      - name: Install Dependencies
        run: flutter pub get

     - name: Build APK Release
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Injaz-Habit-Tracker-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
